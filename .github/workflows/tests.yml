name: Tests

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Run tests
        run: |
          set -e
          for t in tests/*.php; do
            echo "== $t"
            php "$t"
          done
